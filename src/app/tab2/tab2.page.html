<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Anuncios
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
<ion-grid>
    
    <ion-row style="border-bottom: 2px solid #ccc; font-weight: bold; background-color: var(--ion-color-light);">
      <ion-col size="1">ID</ion-col>
      <ion-col size="2">Titulo</ion-col>
      <ion-col size="3">Tipo</ion-col>
      <ion-col size="4">Descripcion</ion-col>
      <ion-col size="3">Fecha Publicacion</ion-col>

    </ion-row>

  </ion-grid>  
    @for(anuncio of anuncios; track anuncio.idAnuncio){
    <ion-row style="border-bottom: 1px solid #eee; align-items: center;">
      <ion-col size="1">{{anuncio.idAnuncio}}</ion-col>
      <ion-col size="2">{{anuncio.titulo}}</ion-col>
      <ion-col size="2">{{anuncio.tipo}}</ion-col>      
      <ion-col size="4">{{anuncio.descripcion}}</ion-col>
      <ion-col size="3">{{anuncio.fechaPublicacion | date}}</ion-col> 
      <ion-img [src]="obtenerImagen(anuncio.imagen)"> </ion-img> 
    </ion-row>
    } @empty {
      <ion-row>
        <ion-col size="12" class="ion-text-center">No hay anuncios disponibles</ion-col>
      </ion-row>
    }

</ion-content>
